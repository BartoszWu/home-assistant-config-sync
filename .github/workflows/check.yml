name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the App's pinned Python dependencies
        run: |
          python - <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          dependencies = re.findall(r'"([A-Za-z][A-Za-z0-9_-]*==[^"\s]+)"', Path('import/Dockerfile').read_text())
          if len(dependencies) != 4:
              raise SystemExit('Unexpected Docker dependency declaration')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *dependencies])
          PY
      - run: ./scripts/check
      - name: Compile filesystem permission profiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor
          sudo apparmor_parser -Q import/apparmor.txt
          sudo apparmor_parser -Q export/apparmor.txt
