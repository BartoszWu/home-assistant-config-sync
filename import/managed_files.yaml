# Declarative Managed Files policy for HA Config Sync — Import.
# Lives in the App code repository only. The data repository cannot expand this list.
#
# Exact `path` entries remain the V1 allowlist.
# `prefix` entries discover .js/.mjs under that directory in the pinned Git commit.
# New dashboard frontend modules belong under www/dashboard/ (not the www/ root).
# Existing www/temperature-card.mjs stays on the exact path; do not wildcard all of www/.
schema_version: 1

# Container mount of Supervisor type homeassistant_config (see import/config.yaml).
ha_config_root: /homeassistant

managed_files:
  - path: packages/temperatura.yaml
    profile: package

  - path: www/temperature-card.mjs
    profile: frontend_module

  - prefix: www/dashboard/
    extensions:
      - .js
      - .mjs
    profile: frontend_module
